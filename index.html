<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lighthouse — a tiny adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e5da;color:#173b3e;font-family:Arial,sans-serif}main{max-width:1000px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;border-bottom:1px solid #173b3e;padding-bottom:18px;font-size:12px;letter-spacing:2px}.scene{margin-top:50px;display:grid;grid-template-columns:1fr 240px;gap:55px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font-family:Georgia,serif;font-weight:400;font-size:40px;line-height:1.05;margin:18px 0 25px}#description{font-family:Georgia,serif;font-size:22px;line-height:1.6;max-width:590px}#art{height:190px;width:100%;color:var(--accent,#40676b);border-bottom:1px solid #173b3e33;margin-bottom:30px}.map{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:15px 0 35px}.cell{border:1px solid #173b3e40;padding:18px 10px;min-height:85px;font-size:12px;line-height:1.5}.cell.active{background:#173b3e;color:#fff}.cell.active:before{content:'● ';color:#e6bc72}.controls{display:grid;grid-template-columns:repeat(3,48px);gap:6px}button{border:1px solid #173b3e;background:transparent;color:inherit;border-radius:3px;min-height:44px;cursor:pointer;font-size:19px}button:hover{background:#173b3e;color:white}button:focus-visible{outline:3px solid #c08036;outline-offset:3px}#message{min-height:48px;margin-top:24px;font-size:14px;line-height:1.5;color:#845029}#exits{font-size:13px}footer{margin-top:65px;border-top:1px solid #173b3e40;padding-top:18px;font-size:12px;color:#536764}@media(max-width:650px){.scene{grid-template-columns:1fr;gap:20px;margin-top:30px}h1{font-size:40px}.map{max-width:280px}#art{height:140px}footer{margin-top:30px}}
